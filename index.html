<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語カード ・ Kosakata Minna no Nihongo Bab 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F8F3EA;
    --paper: #FFFDF9;
    --ink: #4A4038;
    --ink-soft: #8A7F73;
    --sakura: #E9B8C0;
    --sakura-deep: #D98FA0;
    --matcha: #A9C4A2;
    --matcha-deep: #7FA278;
    --sora: #A9BFD9;
    --sora-deep: #7C9AC4;
    --tsuchi: #DDB27E;
    --tsuchi-deep: #C9954E;
    --line: #E7DDCE;
    --shadow: rgba(120, 100, 80, 0.14);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(233,184,192,0.18), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(169,196,162,0.18), transparent 40%),
      var(--cream);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    padding: 28px 18px 60px;
  }

  header{
    max-width: 880px;
    margin: 0 auto 28px;
    text-align:center;
  }

  .kanji-title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size: clamp(28px, 5vw, 40px);
    color: var(--sakura-deep);
    letter-spacing: 1px;
    margin: 0;
  }

  .sub-title{
    margin: 6px 0 0;
    font-size: 15px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .progress-row{
    max-width: 880px;
    margin: 22px auto 0;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .progress-track{
    flex:1;
    height:8px;
    background: var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--sakura), var(--matcha));
    width:0%;
    transition: width .35s ease;
  }

  .categories{
    max-width: 880px;
    margin: 22px auto 0;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }

  .cat-btn{
    border:2px solid transparent;
    background: var(--paper);
    color: var(--ink-soft);
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border-radius:14px;
    cursor:pointer;
    box-shadow: 0 3px 0 var(--shadow);
    transition: transform .15s ease, border-color .15s ease, color .15s ease;
  }
  .cat-btn:hover{ transform: translateY(-2px); }
  .cat-btn.active{
    color: var(--paper);
    border-color: transparent;
  }
  .cat-btn.active[data-cat="sifat-i"]{ background: var(--sakura-deep); }
  .cat-btn.active[data-cat="sifat-na"]{ background: var(--sora-deep); }
  .cat-btn.active[data-cat="benda"]{ background: var(--matcha-deep); }
  .cat-btn.active[data-cat="lain"]{ background: var(--tsuchi-deep); }

  main{
    max-width: 880px;
    margin: 30px auto 0;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .card-scene{
    perspective: 1200px;
    height: 190px;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    border-radius: 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 14px;
    backface-visibility: hidden;
    box-shadow: 0 6px 0 var(--shadow);
    border: 2px solid var(--line);
  }

  .front{ background: var(--paper); }
  .back{
    transform: rotateY(180deg);
    background: var(--paper);
  }

  .cat-sifat-i .front{ border-color: var(--sakura); }
  .cat-sifat-na .front{ border-color: var(--sora); }
  .cat-benda .front{ border-color: var(--matcha); }
  .cat-lain .front{ border-color: var(--tsuchi); }

  .jp-text{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size: clamp(20px, 4vw, 26px);
    line-height:1.3;
  }
  .romaji-text{
    margin-top:6px;
    font-size:13px;
    color: var(--ink-soft);
    font-style:italic;
  }
  .id-text{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:500;
    font-size: clamp(16px, 3.4vw, 20px);
    color: var(--ink);
  }
  .id-label{
    margin-top:8px;
    font-size:11px;
    letter-spacing:.5px;
    color: var(--ink-soft);
  }

  .speak-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background: var(--cream);
    box-shadow: 0 2px 0 var(--shadow);
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform .15s ease;
  }
  .speak-btn:hover{ transform: scale(1.12); }
  .speak-btn:active{ transform: scale(0.94); }

  .hint{
    text-align:center;
    color: var(--ink-soft);
    font-size:12px;
    margin-top: 4px;
  }

  footer{
    max-width:880px;
    margin: 34px auto 0;
    text-align:center;
    color: var(--ink-soft);
    font-size:12px;
  }

  ::selection{ background: var(--sakura); color: var(--paper); }

  @media (max-width:420px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); }
    .card-scene{ height: 170px; }
  }
</style>
</head>
<body>

<header>
  <p class="kanji-title">単語カード</p>
  <p class="sub-title">Kosakata Minna no Nihongo Bab 8 — sentuh kartu untuk membalik, tekan 🔊 untuk dengar bacaannya</p>
</header>

<div class="progress-row">
  <span id="progressLabel">0 / 0 kartu dibalik</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="categories" id="categoryBar"></div>

<main>
  <div class="grid" id="cardGrid"></div>
</main>

<footer>まいにち少しずつ ・ sedikit demi sedikit setiap hari</footer>

<script>
const VOCAB = {
  "sifat-i": {
    label: "Kata Sifat -i",
    words: [
      { jp:"大きい", romaji:"ookii", id:"besar" },
      { jp:"小さい", romaji:"chiisai", id:"kecil" },
      { jp:"新しい", romaji:"atarashii", id:"baru" },
      { jp:"古い", romaji:"furui", id:"lama, tua (benda)" },
      { jp:"いい／よい", romaji:"ii / yoi", id:"baik" },
      { jp:"悪い", romaji:"warui", id:"buruk, jelek" },
      { jp:"暑い", romaji:"atsui", id:"panas (cuaca)" },
      { jp:"寒い", romaji:"samui", id:"dingin (cuaca)" },
      { jp:"熱い", romaji:"atsui", id:"panas (benda/minuman)" },
      { jp:"冷たい", romaji:"tsumetai", id:"dingin (benda/minuman)" },
      { jp:"難しい", romaji:"muzukashii", id:"sulit" },
      { jp:"やさしい", romaji:"yasashii", id:"mudah" },
      { jp:"忙しい", romaji:"isogashii", id:"sibuk" },
      { jp:"おいしい", romaji:"oishii", id:"enak" },
      { jp:"まずい", romaji:"mazui", id:"tidak enak" },
      { jp:"楽しい", romaji:"tanoshii", id:"menyenangkan" },
      { jp:"欲しい", romaji:"hoshii", id:"ingin (memiliki)" }
    ]
  },
  "sifat-na": {
    label: "Kata Sifat -na",
    words: [
      { jp:"元気な", romaji:"genki na", id:"sehat, bersemangat" },
      { jp:"親切な", romaji:"shinsetsu na", id:"baik hati, ramah" },
      { jp:"有名な", romaji:"yuumei na", id:"terkenal" },
      { jp:"便利な", romaji:"benri na", id:"praktis" },
      { jp:"好きな", romaji:"suki na", id:"suka" },
      { jp:"嫌いな", romaji:"kirai na", id:"tidak suka, benci" },
      { jp:"上手な", romaji:"jouzu na", id:"pandai, mahir" },
      { jp:"下手な", romaji:"heta na", id:"tidak pandai" }
    ]
  },
  "benda": {
    label: "Kata Benda",
    words: [
      { jp:"大勢", romaji:"oozei", id:"banyak orang" },
      { jp:"部屋", romaji:"heya", id:"kamar" },
      { jp:"ビル", romaji:"biru", id:"gedung" },
      { jp:"建物", romaji:"tatemono", id:"bangunan" },
      { jp:"国", romaji:"kuni", id:"negara" },
      { jp:"桜", romaji:"sakura", id:"bunga sakura" },
      { jp:"花", romaji:"hana", id:"bunga" },
      { jp:"世界", romaji:"sekai", id:"dunia" },
      { jp:"仕事", romaji:"shigoto", id:"pekerjaan" },
      { jp:"天気", romaji:"tenki", id:"cuaca" },
      { jp:"用事", romaji:"youji", id:"urusan, keperluan" },
      { jp:"意味", romaji:"imi", id:"arti" },
      { jp:"番号", romaji:"bangou", id:"nomor" },
      { jp:"生活", romaji:"seikatsu", id:"kehidupan" },
      { jp:"富士山", romaji:"fujisan", id:"Gunung Fuji" },
      { jp:"味", romaji:"aji", id:"rasa" }
    ]
  },
  "lain": {
    label: "Keterangan & Lainnya",
    words: [
      { jp:"どんな", romaji:"donna", id:"yang bagaimana" },
      { jp:"とても", romaji:"totemo", id:"sangat" },
      { jp:"あまり〜ない", romaji:"amari ~nai", id:"tidak begitu" },
      { jp:"ぜんぜん〜ない", romaji:"zenzen ~nai", id:"sama sekali tidak" },
      { jp:"そして", romaji:"soshite", id:"dan kemudian" }
    ]
  }
};

let currentCat = "sifat-i";
let flippedCount = 0;

// ---- Audio: soft click via Web Audio API ----
let audioCtx;
function playClick(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(340, t + 0.09);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
  }catch(e){}
}

function playChime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [660, 880].forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t + i*0.08);
      gain.gain.setValueAtTime(0.0001, t + i*0.08);
      gain.gain.exponentialRampToValueAtTime(0.1, t + i*0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + i*0.08 + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t + i*0.08);
      osc.stop(t + i*0.08 + 0.32);
    });
  }catch(e){}
}

// ---- Speech: pronounce Japanese word ----
function speakWord(text){
  if(!('speechSynthesis' in window)){ return; }
  window.speechSynthesis.cancel();
  const clean = text.replace(/／.*/, "").replace(/〜.*/, "");
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = "ja-JP";
  utter.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const jaVoice = voices.find(v => v.lang && v.lang.startsWith("ja"));
  if(jaVoice) utter.voice = jaVoice;
  window.speechSynthesis.speak(utter);
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// ---- Build category buttons ----
const categoryBar = document.getElementById('categoryBar');
Object.keys(VOCAB).forEach(key=>{
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (key === currentCat ? ' active' : '');
  btn.dataset.cat = key;
  btn.textContent = VOCAB[key].label + " (" + VOCAB[key].words.length + ")";
  btn.addEventListener('click', ()=>{
    currentCat = key;
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
  });
  categoryBar.appendChild(btn);
});

// ---- Render cards ----
function renderCards(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  flippedCount = 0;
  const words = VOCAB[currentCat].words;

  words.forEach(w=>{
    const scene = document.createElement('div');
    scene.className = 'card-scene';

    const card = document.createElement('div');
    card.className = 'card cat-' + currentCat;

    const front = document.createElement('div');
    front.className = 'face front';
    front.innerHTML = `
      <div class="jp-text">${w.jp}</div>
      <div class="romaji-text">${w.romaji}</div>
      <div class="hint">sentuh untuk arti</div>
    `;

    const speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.textContent = '🔊';
    speakBtn.title = 'Dengar cara baca';
    speakBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      speakWord(w.romaji.split(' / ')[0].split(' na')[0]);
    });
    front.appendChild(speakBtn);

    const back = document.createElement('div');
    back.className = 'face back';
    back.innerHTML = `
      <div class="id-text">${w.id}</div>
      <div class="id-label">${w.jp} · ${w.romaji}</div>
    `;

    card.appendChild(front);
    card.appendChild(back);
    scene.appendChild(card);
    grid.appendChild(scene);

    card.addEventListener('click', ()=>{
      const wasFlipped = card.classList.contains('flipped');
      card.classList.toggle('flipped');
      if(!wasFlipped){
        playClick();
        flippedCount++;
      } else {
        flippedCount = Math.max(0, flippedCount - 1);
      }
      updateProgress(words.length);
    });
  });

  updateProgress(words.length);
}

function updateProgress(total){
  document.getElementById('progressLabel').textContent = flippedCount + " / " + total + " kartu dibalik";
  const pct = total ? (flippedCount/total)*100 : 0;
  document.getElementById('progressFill').style.width = pct + "%";
  if(flippedCount === total && total > 0){ playChime(); }
}

renderCards();
</script>
</body>
</html>
